name: Build, Sign, Release
permissions: write-all
on:
  push:
    branches:
      - main
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'skip-ci') }}
    steps:
      - uses: actions/checkout@v6
      - run: |
          APP_VERSION=$(grep 'versionName' build.gradle | sed 's/.*versionName "\(.*\)"/\1/')
          echo "RELEASE_VERSION=$APP_VERSION" >> $GITHUB_ENV
      - name: Set up JDK env
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6 #.3.0
        with:
          gradle-version: 9.3.1
          cache-provider: basic

      - name: Execute Gradle build
        run: gradle --no-daemon --build-cache assembleAospWithoutQuickstepRelease

      - name: Get build tools
        run: |
          BUILD_TOOLS_PATH=/usr/local/lib/android/sdk/build-tools/$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOLS=$BUILD_TOOLS_PATH" >> $GITHUB_ENV

      - name: Zipalign the APK
        run: |
          $BUILD_TOOLS/zipalign -v 4 build/outputs/apk/aospWithoutQuickstep/release/bunny-launcher-aosp-withoutQuickstep-release-unsigned.apk app-release-unsigned.apk

      - name: Sign the APK
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWD: ${{ secrets.KEY_PASSWD }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > keystore.jks
          "$BUILD_TOOLS/apksigner" sign \
            --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEY_PASSWD" \
            --key-pass "pass:$KEY_PASSWD" \
            --out app-release.apk \
            app-release-unsigned.apk

      - name: Verify the APK signature
        run: $BUILD_TOOLS/apksigner verify app-release.apk

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          release_name: Release ${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false

      - name: Upload release APK
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app-release.apk
          asset_name: bunny-launcher.apk
          asset_content_type: application/vnd.android.package-archive

